<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="#09090b" stroke="url(#bgGrad)" stroke-width="4" />
  
  <!-- Glowing Inner Fill -->
  <rect x="12" y="12" width="76" height="76" rx="20" fill="url(#bgGrad)" opacity="0.9" filter="url(#glow)" />
  
  <!-- HV Monogram Text -->
  <text x="50%" y="62%" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">HV</text>
  
  <!-- Tiny Sparkle -->
  <polygon points="78,22 81,28 87,31 81,34 78,40 75,34 69,31 75,28" fill="#f59e0b" />
</svg>